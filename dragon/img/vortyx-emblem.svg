<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400" role="img" aria-labelledby="t d">
  <title id="t">Vortyx emblem</title>
  <desc id="d">A gold and fire-orange dragon emblem: a coiled dragon circling a burning ember on a dark starfield, drawn for this page because the original Vortyx page had no dragon picture.</desc>
  <defs>
    <radialGradient id="bg" cx="50%" cy="45%" r="70%">
      <stop offset="0" stop-color="#2a0f05"/><stop offset=".6" stop-color="#0d0612"/><stop offset="1" stop-color="#05040c"/>
    </radialGradient>
    <radialGradient id="ember" cx="50%" cy="50%" r="50%">
      <stop offset="0" stop-color="#fff6c2"/><stop offset=".35" stop-color="#ffd700"/><stop offset=".7" stop-color="#ff6b35"/><stop offset="1" stop-color="#ff4500" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="body" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#ffd700"/><stop offset=".55" stop-color="#ff8c2a"/><stop offset="1" stop-color="#dc143c"/>
    </linearGradient>
  </defs>
  <rect width="400" height="400" rx="28" fill="url(#bg)"/>
  <g fill="#fff" opacity=".7">
    <circle cx="40" cy="60" r="1.4"/><circle cx="350" cy="44" r="1.8"/><circle cx="310" cy="330" r="1.2"/><circle cx="70" cy="320" r="1.6"/><circle cx="200" cy="30" r="1.1"/><circle cx="372" cy="200" r="1.3"/><circle cx="24" cy="190" r="1"/>
  </g>
  <circle cx="200" cy="205" r="70" fill="url(#ember)"/>
  <!-- coiled dragon body -->
  <path d="M200 70c80 0 135 58 135 132s-58 128-132 128c-62 0-108-44-108-100 0-48 38-86 86-86 40 0 70 30 70 66" fill="none" stroke="url(#body)" stroke-width="22" stroke-linecap="round"/>
  <!-- spines -->
  <g fill="#ffd700">
    <path d="M300 104l26-22-6 34z"/><path d="M334 170l32-8-22 26z"/><path d="M330 250l30 12-32 8z"/><path d="M276 314l18 26-30-12z"/><path d="M180 330l-6 30-14-26z"/><path d="M102 270l-30 6 22-22z"/>
  </g>
  <!-- head -->
  <path d="M190 58c18-14 46-14 62 2l22-6-10 20c4 12 0 24-12 30l-30-4-20 12-8-22z" fill="url(#body)"/>
  <circle cx="236" cy="70" r="5" fill="#00d9ff"/>
  <path d="M196 56l-14-26 26 16zM222 50l2-28 14 24z" fill="#ffd700"/>
  <!-- tail curl into ember -->
  <path d="M246 236c0 20-16 34-36 34" fill="none" stroke="#ffd700" stroke-width="8" stroke-linecap="round"/>
</svg>
