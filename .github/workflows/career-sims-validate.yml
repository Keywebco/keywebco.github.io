name: Career Sims brain check
on:
  push:
    paths: ["career-sims/**", ".github/workflows/career-sims-validate.yml"]
  pull_request:
    paths: ["career-sims/**", ".github/workflows/career-sims-validate.yml"]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install jsonschema==4.23.0 pyyaml==6.0.2
      - name: Validate every brain file, the pinned canon, and the catalog
        run: python3 career-sims/tools/brains.py check
