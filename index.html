<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta http-equiv="refresh" content="2;url=https://keywebco.github.io/nextxus-lasting-edition/">
  <title>NextXus HumanCodex Federation</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      background: #070b14;
      color: #c9a84c;
      font-family: 'Courier New', Courier, monospace;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      text-align: center;
    }
    @keyframes fadeIn {
      from { opacity: 0; transform: translateY(10px); }
      to   { opacity: 1; transform: translateY(0); }
    }
    @keyframes pulse {
      0%, 100% { opacity: 1; }
      50%       { opacity: 0.4; }
    }
    h1 {
      font-size: clamp(1.2rem, 4vw, 2rem);
      letter-spacing: 0.18em;
      text-transform: uppercase;
      animation: fadeIn 0.8s ease forwards;
      margin-bottom: 1.6rem;
    }
    p.status {
      font-size: 1rem;
      letter-spacing: 0.1em;
      animation: fadeIn 0.8s ease 0.3s both;
      margin-bottom: 0.8rem;
    }
    p.target {
      font-size: 1rem;
      letter-spacing: 0.08em;
      animation: fadeIn 0.8s ease 0.6s both, pulse 1.8s ease 0.9s infinite;
      color: #e8c66a;
    }
    .bar {
      width: 220px;
      height: 2px;
      background: #c9a84c33;
      border-radius: 2px;
      margin-top: 2.4rem;
      overflow: hidden;
      animation: fadeIn 0.8s ease 0.9s both;
    }
    .bar-fill {
      height: 100%;
      width: 0;
      background: #c9a84c;
      border-radius: 2px;
      animation: loadBar 2s linear 0.2s forwards;
    }
    @keyframes loadBar {
      from { width: 0; }
      to   { width: 100%; }
    }
  </style>
</head>
<body>
  <main>
    <h1>NextXus HumanCodex Federation</h1>
    <p class="status">Loading the Federation...</p>
    <p class="target">&#8594; nextxus-lasting-edition</p>
    <div class="bar"><div class="bar-fill"></div></div>
  </main>
  <script>
    setTimeout(function() {
      window.location.replace('https://keywebco.github.io/nextxus-lasting-edition/');
    }, 2000);
  </script>
</body>
</html>
